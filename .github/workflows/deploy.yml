name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let an in-flight deploy finish; queue newer pushes behind it so the
# latest commit is the last one uploaded.
concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run tests
        run: pnpm run test

      - name: Build OpenNext worker bundle
        run: pnpm run build:worker
        env:
          # NEXT_PUBLIC_* values are inlined into the bundle at build time, so they
          # have to be set here — the vars in wrangler.jsonc only reach the runtime.
          NEXT_PUBLIC_SITE_NAME: gorib.lol
          NEXT_PUBLIC_SITE_URL: https://gorib.lol
          NEXT_PUBLIC_ADS_ENABLED: "true"
          NEXT_PUBLIC_AD_SLOTS_ENABLED: "true"
          NEXT_PUBLIC_AD_PROVIDER: "custom"
          NEXT_PUBLIC_CUSTOM_AD_SCRIPT_URL: "https://unfoldedtrade.com/b/XbV-s.dwG/l-0wYfWbcx/oe/mj9JuUZlUfl/kNPCTEcv0LN/TFQi0SO/DoU/tTNPzoQm1aN/DyQf4hODQL"
          # Multitag with popunder/overlay modules: never loaded on player pages.
          NEXT_PUBLIC_CUSTOM_AD_PLAYER_SAFE: "false"
          NEXT_PUBLIC_AD_HOME_TOP: "true"
          NEXT_PUBLIC_AD_HOME_FEED: "true"
          NEXT_PUBLIC_AD_DETAILS_MID: "true"
          NEXT_PUBLIC_AD_PLAYER_BOTTOM: "true"
          NEXT_PUBLIC_AD_CATALOG_HEADER: "true"
          NEXT_PUBLIC_AD_CATALOG_IN_FEED: "true"
          NEXT_PUBLIC_AD_SEARCH: "true"
          NEXT_PUBLIC_AD_LIVE_TV: "false"
          NEXT_PUBLIC_AD_MOBILE_STICKY: "true"
          TMDB_BASE_URL: https://api.themoviedb.org/3
          TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
          STREAMING_PROVIDER: mock
          # Scoped to this step on purpose. Prerendered routes hit TMDB during the
          # build, but the unit tests assert the offline fallback path and would
          # make real network calls (and time out) if a key were in scope for them.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
